# =========================================================================
# NGINX LOAD BALANCING & RATE LIMITING CONFIGURATION
# eBay Clone Marketplace Project
# =========================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # =========================================================================
    # 1. RATE LIMITING ZONE (IP-BASED, NO LOGIN REQUIRED)
    # 10MB zone tracks ~160,000 unique client IP addresses.
    # Rate limit: 20 requests / second per IP.
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_ip_limit:10m rate=20r/s;
    limit_req_status 429;

    # =========================================================================
    # 2. LOAD BALANCING UPSTREAM CLUSTER
    # Distributes incoming traffic across multiple Node.js backend instances.
    # Algorithms supported: Round Robin (default), least_conn, ip_hash.
    # =========================================================================
    upstream backend_cluster {
        # Instance 1 (Primary Node.js process)
        server 127.0.0.1:5000 weight=1 max_fails=3 fail_timeout=10s;
        
        # Instance 2 (Worker Node.js process)
        server 127.0.0.1:5001 weight=1 max_fails=3 fail_timeout=10s;
        
        # Instance 3 (Worker Node.js process - optional)
        server 127.0.0.1:5002 weight=1 max_fails=3 fail_timeout=10s;

        # Keepalive connections to backend
        keepalive 32;
    }

    # Upstream for Frontend Vite Dev Server (or can point to built dist/ folder)
    upstream frontend_vite {
        server 127.0.0.1:5173;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # =========================================================================
        # 3. BACKEND API ROUTING + RATE LIMITING + LOAD BALANCING
        # =========================================================================
        location /api/ {
            # Apply Nginx IP Rate Limiting (burst of 10 requests allowed without delay)
            limit_req zone=api_ip_limit burst=10 nodelay;

            # Pass request to the balanced cluster
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward real client IP headers to Node.js backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # =========================================================================
        # 4. FRONTEND APPLICATION ROUTING
        # =========================================================================
        location / {
            proxy_pass http://frontend_vite;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
